<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Thư Viện Ảnh Chú Chó Đáng Yêu</h1>
    </header>

    
    <div id="image">
        Hover over an image below to display here.
    </div>

    
    <div class="gallery">
        <img class="preview" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" alt="Chú chó Beagle đáng yêu" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=500" alt="Chú chó Corgi chân ngắn" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=500" alt="Chú chó Golden mỉm cười" onmouseover="upDate(this)" onmouseout="unDo()">
    </div>

</body>
</html>
